[package]
name = "parley"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "UCTP-speaking conversation server on rvoip voip-3 nouns"
authors = ["Rudeless"]

[features]
default = ["sms-fake", "uctp", "sip", "media-webrtc", "vapi"]
sms-fake = []
sms-telnyx = []
sip = ["dep:rvoip-sip"]
uctp = ["dep:rvoip-uctp", "dep:rvoip-websocket", "dep:rvoip-auth-core"]
vapi = ["dep:rvoip-vapi"]
media-webrtc = ["uctp", "rvoip-websocket/media-webrtc", "dep:rvoip-webrtc", "rvoip-core/opus"]

[dependencies]
# rvoip 0.3.12 baseline: ca7861af4c9920f6949422ae1f40507bf56ede97.
# Local conference patches live in ../rvoip-conference; see scripts/setup-rvoip.sh.
# Do not enable rvoip `app`: Parley uses the Orchestrator directly.
rvoip-core = { path = "../rvoip-conference/crates/foundation/rvoip-core" }
rvoip-sip = { path = "../rvoip-conference/crates/sip/rvoip-sip", optional = true }
rvoip-uctp = { path = "../rvoip-conference/crates/uctp/rvoip-uctp", optional = true }
rvoip-websocket = { path = "../rvoip-conference/crates/uctp/rvoip-websocket", optional = true }
rvoip-webrtc = { path = "../rvoip-conference/crates/webrtc/rvoip-webrtc", optional = true }
rvoip-auth-core = { path = "../rvoip-conference/crates/identity/auth-core", optional = true }
rvoip-vapi = { path = "../rvoip-conference/crates/extensions/rvoip-vapi", optional = true }

tokio = { version = "1", features = ["full"] }
axum = "0.7"
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
dotenvy = "0.15"
bytes = "1"
rand = "0.8"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Vendored Vapi SDK snapshot; see vendor/server-sdk-rust/PROVENANCE.md.
vapi = { path = "vendor/server-sdk-rust" }
# telnyx-rs (crates.io). rustls-ring avoids a cmake/aws-lc build.
telnyx = { version = "0.1", default-features = false, features = ["messaging", "numbers", "webhooks", "rustls-ring"] }
# cloudflare-rs for named tunnels + DNS. Local cloudflared still runs the connector.
cloudflare = { version = "0.14", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
ed25519-dalek = "2.2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"

[[test]]
name = "talk_webrtc"
required-features = ["media-webrtc"]
